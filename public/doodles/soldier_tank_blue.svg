<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#rough-ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Tank Tracks -->
    <rect x="20" y="70" width="85" height="24" rx="12" fill="none" stroke="#1138a6" stroke-width="3" />
    <circle cx="34" cy="82" r="6" fill="none" stroke="#1138a6" stroke-width="2" />
    <circle cx="50" cy="82" r="6" fill="none" stroke="#1138a6" stroke-width="2" />
    <circle cx="66" cy="82" r="6" fill="none" stroke="#1138a6" stroke-width="2" />
    <circle cx="82" cy="82" r="6" fill="none" stroke="#1138a6" stroke-width="2" />
    <line x1="20" y1="82" x2="28" y2="82" stroke="#1138a6" stroke-width="2" />
    <line x1="88" y1="82" x2="105" y2="82" stroke="#1138a6" stroke-width="2" />
    <!-- Tank Hull -->
    <polygon points="25,70 35,52 82,52 92,70" fill="none" stroke="#1138a6" stroke-width="3" />
    <!-- Turret & Cannon -->
    <path d="M 42 52 C 42 38, 72 38, 72 52 Z" fill="none" stroke="#1138a6" stroke-width="3" />
    <line x1="72" y1="44" x2="114" y2="44" stroke="#1138a6" stroke-width="4.5" />
    <rect x="110" y="41" width="5" height="6" stroke="#1138a6" stroke-width="2" fill="none" />
    <!-- Antenna & Little Flag -->
    <line x1="45" y1="40" x2="45" y2="22" stroke="#1138a6" stroke-width="1.8" />
    <polygon points="45,22 55,26 45,30" fill="#1138a6" stroke="#1138a6" />
    
  </g>
</svg>