<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#rough-ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Heavy Machine Gunner behind tripod -->
    <circle cx="38" cy="42" r="8" fill="none" stroke="#1138a6" stroke-width="3" />
    <polyline points="38,50 44,72 34,98" fill="none" stroke="#1138a6" stroke-width="3" />
    <polyline points="44,72 56,92" fill="none" stroke="#1138a6" stroke-width="3" />
    <!-- Hands gripping twin spade grips -->
    <polyline points="40,56 50,56 54,54" fill="none" stroke="#1138a6" stroke-width="3" />
    <!-- Machine Gun Body & Heavy Barrel -->
    <rect x="52" y="48" width="38" height="10" fill="none" stroke="#1138a6" stroke-width="3" />
    <line x1="90" y1="53" x2="114" y2="53" stroke="#1138a6" stroke-width="4" />
    <!-- Tripod Legs -->
    <line x1="72" y1="58" x2="62" y2="92" stroke="#1138a6" stroke-width="3" />
    <line x1="72" y1="58" x2="88" y2="92" stroke="#1138a6" stroke-width="3" />
    <!-- Ammo Belt curving out -->
    <path d="M 64 58 Q 62 76 52 82" stroke="#1138a6" stroke-width="3" fill="none" stroke-dasharray="2,3" />
    
  </g>
</svg>