<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#rough-ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Fortified Sandbag Bunker / Pillbox -->
    <!-- Sandbag rows -->
    <path d="M 22 92 Q 40 88 58 92 Q 76 88 94 92" stroke="#ba1825" stroke-width="4" fill="none" />
    <path d="M 26 82 Q 44 78 62 82 Q 80 78 98 82" stroke="#ba1825" stroke-width="4" fill="none" />
    <path d="M 30 72 Q 48 68 66 72 Q 84 68 102 72" stroke="#ba1825" stroke-width="4" fill="none" />
    <!-- Bunker Roof Slab -->
    <polygon points="18,62 108,62 100,50 26,50" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Machine Gun Vision Slit with gun barrel poking out -->
    <rect x="42" y="56" width="36" height="5" fill="#ba1825" />
    <line x1="60" y1="58" x2="78" y2="58" stroke="#ba1825" stroke-width="3" />
    <!-- Signal Flag on Roof -->
    <line x1="32" y1="50" x2="32" y2="24" stroke="#ba1825" stroke-width="2" />
    <polygon points="32,24 48,28 32,34" fill="#ba1825" stroke="#ba1825" />
    
  </g>
</svg>