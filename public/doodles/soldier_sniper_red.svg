<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#rough-ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Prone / Kneeling Sniper -->
    <circle cx="45" cy="48" r="8" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Ghillie cap with grass lines -->
    <path d="M 38 45 Q 45 38 52 45" stroke="#ba1825" stroke-width="3" fill="none" />
    <line x1="42" y1="40" x2="40" y2="34" stroke="#ba1825" stroke-width="2" />
    <line x1="47" y1="39" x2="48" y2="33" stroke="#ba1825" stroke-width="2" />
    <!-- Torso leaning forward -->
    <polyline points="45,56 60,68 85,82" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Legs prone -->
    <polyline points="85,82 105,92 115,90" fill="none" stroke="#ba1825" stroke-width="3" />
    <polyline points="85,82 98,98 108,102" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Long Sniper Rifle with Bipod & Scope -->
    <line x1="28" y1="62" x2="10" y2="60" stroke="#ba1825" stroke-width="3" />
    <line x1="28" y1="62" x2="8" y2="60" stroke="#ba1825" stroke-width="3" />
    <rect x="22" y="54" width="16" height="5" fill="none" stroke="#ba1825" stroke-width="2" /> <!-- Scope -->
    <!-- Bipod legs -->
    <polyline points="14,60 10,75" stroke="#ba1825" stroke-width="2" />
    <polyline points="14,60 18,75" stroke="#ba1825" stroke-width="2" />
    
  </g>
</svg>