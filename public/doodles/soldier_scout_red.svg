<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#rough-ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Scout running with backpack & walkie-talkie -->
    <circle cx="68" cy="34" r="8" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Running Torso angled -->
    <line x1="65" y1="42" x2="55" y2="72" stroke="#ba1825" stroke-width="3" />
    <!-- Backpack -->
    <rect x="42" y="48" width="13" height="20" rx="3" fill="none" stroke="#ba1825" stroke-width="3" />
    <line x1="48" y1="48" x2="48" y2="26" stroke="#ba1825" stroke-width="2" /> <!-- Whip antenna -->
    <!-- Running Legs -->
    <polyline points="55,72 38,82 28,102" fill="none" stroke="#ba1825" stroke-width="3" />
    <polyline points="55,72 75,85 92,90" fill="none" stroke="#ba1825" stroke-width="3" />
    <!-- Running Arms -->
    <polyline points="62,50 48,60 52,70" fill="none" stroke="#ba1825" stroke-width="3" />
    <polyline points="62,50 82,48 90,38" fill="none" stroke="#ba1825" stroke-width="3" />
    
  </g>
</svg>